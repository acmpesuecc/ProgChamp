<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Snake</title>
<style>
html,body{margin:0;height:100%;background:#1e0e1e;color:#f5cdd2;font-family:monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
#w{text-align:center}
canvas{width:min(88vmin,420px);aspect-ratio:1;background:#12091a;border-radius:8px;display:block;margin-top:8px}
</style>
<div id=w><div>Score <b id=s>0</b> &nbsp; Best <b id=b>0</b></div><canvas id=c width=400 height=400></canvas></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=20;
let sn,dir,nd,food,score,best=0,state,speed;
function init(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=nd={x:1,y:0};score=0;speed=130;state='ready';place();show();clearTimeout(tm);draw()}
function place(){do food={x:Math.random()*N|0,y:Math.random()*N|0};while(sn.some(p=>p.x==food.x&&p.y==food.y))}
function show(){s.textContent=score;b.textContent=best}
function turn(d){if(d.x==-dir.x&&d.y==-dir.y)return;nd=d;if(state=='ready'){state='play';tick()}else if(state=='over')init()}
let tm;
function tick(){
  if(state!='play')return;
  dir=nd;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(p=>p.x==h.x&&p.y==h.y)){state='over';draw();return}
  sn.unshift(h);
  if(h.x==food.x&&h.y==food.y){score++;best=Math.max(best,score);speed=Math.max(60,speed-3);place();show()}else sn.pop();
  draw();tm=setTimeout(tick,speed);
}
function draw(){
  x.fillStyle='#12091a';x.fillRect(0,0,400,400);
  x.fillStyle='#f0899e';x.fillRect(food.x*S+3,food.y*S+3,S-6,S-6);
  sn.forEach((p,i)=>{x.fillStyle=i?'#7c4dbf':'#e85d82';x.fillRect(p.x*S+1,p.y*S+1,S-2,S-2)});
  x.fillStyle='#f5cdd2';x.textAlign='center';x.font='20px monospace';
  if(state=='ready')x.fillText('Press an arrow key / swipe',200,200);
  if(state=='over'){x.fillText('Game over',200,190);x.fillText('Press a key to retry',200,220)}
}
const dirs={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
addEventListener('keydown',e=>{const d=dirs[e.key];if(d){e.preventDefault();turn(d)}});
let tx,ty;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;turn(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)})});
init();
</script>
